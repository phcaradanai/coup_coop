<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad_Unk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#0d0e14" />
      <stop offset="100%" stop-color="#181a24" />
    </linearGradient>

    <radialGradient id="aura_Unk" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="450" height="600" rx="20" fill="url(#bgGrad_Unk)" stroke="#27272a" stroke-width="3" />
  <rect x="10" y="10" width="430" height="580" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Ambient Core Glow -->
  <circle cx="225" cy="270" r="210" fill="url(#aura_Unk)" />

  <!-- Binary Data Encryption Noise Matrix -->
  <g opacity="0.12" fill="#38bdf8" font-family="'Courier New', monospace" font-size="10">
    <text x="30" y="120">01001001 01000100 01000101 01001110 01010100</text>
    <text x="30" y="150">01001001 01010100 01011001 00100000 01001100</text>
    <text x="30" y="180">01001111 01000011 01001011 01000101 01000100</text>
    <text x="30" y="380">01010001 01010101 01000001 01001110 01010100</text>
    <text x="30" y="410">01010101 01001101 00100000 01001011 01000101</text>
    <text x="30" y="440">01011001 00100000 01010011 01000101 01000011</text>
  </g>

  <!-- CHARACTER ART: CLOAKED CYBER OPERATIVE (Shadowed Persona) -->
  <g transform="translate(0, 20)">
    
    <!-- Heavy Stealth Cowl / Shroud Silhouette -->
    <path d="M 110 500 Q 120 370 160 330 L 225 350 L 290 330 Q 330 370 340 500 L 380 560 L 70 560 Z" fill="#0c0d12" stroke="#27272a" stroke-width="2" />

    <!-- Hood Deep Shadows -->
    <path d="M 150 330 Q 140 180 225 150 Q 310 180 300 330 Q 270 360 225 365 Q 180 360 150 330 Z" fill="#08090d" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Inner Hood Black Void -->
    <path d="M 168 310 Q 160 200 225 180 Q 290 200 282 310 Q 260 335 225 340 Q 190 335 168 310 Z" fill="#020204" />

    <!-- GLOWING QUANTUM OPTIC SENSOR (Cyan Slit Eye in Void) -->
    <g filter="url(#glowCyan)">
      <polygon points="190,246 225,250 260,246 255,254 225,258 195,254" fill="#38bdf8" />
      <line x1="170" y1="250" x2="280" y2="250" stroke="#ffffff" stroke-width="2" />
      <!-- Pulsing Data Target Node -->
      <circle cx="225" cy="250" r="4" fill="#ffffff" />
    </g>

    <!-- Digital Glitch / Decryption Artifact Scanlines -->
    <g stroke="#38bdf8" stroke-width="1.5" opacity="0.75" filter="url(#glowCyan)">
      <line x1="140" y1="210" x2="210" y2="210" />
      <line x1="250" y1="225" x2="310" y2="225" />
      <line x1="120" y1="290" x2="200" y2="290" />
      <line x1="260" y1="320" x2="330" y2="320" />
      <line x1="180" y1="380" x2="270" y2="380" stroke-dasharray="8,4" />
    </g>

    <!-- Holographic Lock Ring Overlay (In Front of Operative) -->
    <g filter="url(#glowCyan)" transform="translate(225, 300)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12,8" opacity="0.6" />
      <polygon points="-25,-15 25,-15 20,25 -20,25" fill="#090a10" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Lock Keyhole Glyph -->
      <circle cx="0" cy="-2" r="6" fill="#38bdf8" />
      <polygon points="-3,-2 3,-2 4,14 -4,14" fill="#38bdf8" />
    </g>

  </g>

  <!-- Card Top Header Label -->
  <g transform="translate(225, 42)">
    <rect x="-125" y="-18" width="250" height="34" rx="6" fill="#090a10" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="4">IDENTITY // LOCKED</text>
  </g>

  <!-- Card Bottom Label Banner -->
  <g transform="translate(225, 555)">
    <rect x="-140" y="-18" width="280" height="34" rx="6" fill="#090a10" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#a1a1aa" text-anchor="middle" letter-spacing="3">ENCRYPTED QUANTUM OPERATIVE</text>
  </g>
</svg>