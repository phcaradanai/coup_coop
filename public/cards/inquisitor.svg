<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad_Inq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d0c" />
      <stop offset="50%" stop-color="#041a18" />
      <stop offset="100%" stop-color="#08312e" />
    </linearGradient>

    <radialGradient id="aura_Inq" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Armor & Coat Gradients -->
    <linearGradient id="coat_Inq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112926" />
      <stop offset="50%" stop-color="#091c1a" />
      <stop offset="100%" stop-color="#030c0b" />
    </linearGradient>

    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="scanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="450" height="600" rx="20" fill="url(#bgGrad_Inq)" stroke="#134e4a" stroke-width="3" />
  <rect x="10" y="10" width="430" height="580" rx="14" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Ambient Core Glow -->
  <circle cx="225" cy="270" r="210" fill="url(#aura_Inq)" />

  <!-- Background Forensic Target Grid -->
  <g opacity="0.15" stroke="#14b8a6" stroke-width="1">
    <line x1="30" y1="120" x2="420" y2="120" />
    <line x1="30" y1="200" x2="420" y2="200" />
    <line x1="30" y1="280" x2="420" y2="280" />
    <line x1="30" y1="360" x2="420" y2="360" />
    <line x1="30" y1="440" x2="420" y2="440" />
    <circle cx="225" cy="240" r="140" fill="none" stroke="#14b8a6" stroke-dasharray="10,6" />
    <circle cx="225" cy="240" r="180" fill="none" stroke="#14b8a6" stroke-dasharray="4,8" />
  </g>

  <!-- Forensic Optical Scanner Ray (Behind Character) -->
  <g filter="url(#scanGlow)" opacity="0.6">
    <polygon points="225,240 80,480 370,480" fill="#14b8a6" fill-opacity="0.1" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="8,4" />
  </g>

  <!-- CHARACTER ART: INQUISITOR (Cybernetic Special Investigator) -->
  <g transform="translate(0, 15)">
    
    <!-- Tactical Trenchcoat & Shoulders -->
    <path d="M 110 490 Q 130 380 170 350 L 225 365 L 280 350 Q 320 380 340 490 L 385 560 L 65 560 Z" fill="url(#coat_Inq)" stroke="#042f2e" stroke-width="2" />

    <!-- Heavy Ballistic Collar / Cowl -->
    <path d="M 160 360 L 180 290 L 225 310 L 270 290 L 290 360 L 225 385 Z" fill="#061f1d" stroke="#14b8a6" stroke-width="1.5" />

    <!-- Chest Forensic Scanner Module -->
    <polygon points="215,385 235,385 240,430 225,445 210,430" fill="#021413" stroke="#2dd4bf" stroke-width="2" filter="url(#glowTeal)" />
    <circle cx="225" cy="415" r="5" fill="#5eead4" filter="url(#glowTeal)" />

    <!-- Tactical Shoulder Armor Plates -->
    <path d="M 110 440 L 150 370 L 175 385 L 135 460 Z" fill="#082522" stroke="#14b8a6" stroke-width="1.5" />
    <path d="M 340 440 L 300 370 L 275 385 L 315 460 Z" fill="#082522" stroke="#14b8a6" stroke-width="1.5" />

    <!-- Neon Circuit Piping Across Chest & Shoulders -->
    <line x1="150" y1="370" x2="215" y2="400" stroke="#2dd4bf" stroke-width="2" filter="url(#glowTeal)" />
    <line x1="300" y1="370" x2="235" y2="400" stroke="#2dd4bf" stroke-width="2" filter="url(#glowTeal)" />
    <circle cx="150" cy="370" r="3" fill="#ffffff" />
    <circle cx="300" cy="370" r="3" fill="#ffffff" />

    <!-- Neck Structure & Armored Throat Shield -->
    <path d="M 200 280 L 200 330 Q 225 340 250 330 L 250 280 Z" fill="#061c1a" />
    <path d="M 210 300 L 240 300 L 235 325 L 215 325 Z" fill="#14b8a6" opacity="0.8" filter="url(#glowTeal)" />

    <!-- Head / Investigator Cowl (Dark Tactical Hood) -->
    <path d="M 170 210 Q 165 140 225 135 Q 285 140 280 210 Q 285 270 265 295 Q 225 315 185 295 Q 165 270 170 210 Z" fill="#031211" stroke="#0f766e" stroke-width="1.5" />

    <!-- Lower Half Tech Face Mask / Respirator Filter -->
    <path d="M 190 245 L 225 260 L 260 245 L 255 285 Q 225 305 195 285 Z" fill="#0d2e2b" stroke="#14b8a6" stroke-width="1.5" />
    <!-- Respirator Slits -->
    <line x1="210" y1="272" x2="215" y2="285" stroke="#2dd4bf" stroke-width="1.5" filter="url(#glowTeal)" />
    <line x1="225" y1="270" x2="225" y2="287" stroke="#5eead4" stroke-width="1.5" filter="url(#glowTeal)" />
    <line x1="240" y1="272" x2="235" y2="285" stroke="#2dd4bf" stroke-width="1.5" filter="url(#glowTeal)" />

    <!-- Upper Face (Shadowed) -->
    <path d="M 185 200 Q 225 195 265 200 L 260 245 L 190 245 Z" fill="#020908" />

    <!-- TRIPLE-LENS QUANTUM OPTIC SCANNER (Signature Inquisitor Eye Unit) -->
    <g filter="url(#glowTeal)">
      <!-- Main Tactical Visor Frame -->
      <polygon points="182,212 225,216 268,212 264,236 225,242 186,236" fill="#04201d" stroke="#2dd4bf" stroke-width="2" />
      
      <!-- Primary Center Lens (Large Quantum Sensor) -->
      <circle cx="225" cy="227" r="9" fill="#042f2e" stroke="#5eead4" stroke-width="2" />
      <circle cx="225" cy="227" r="5" fill="#ffffff" />
      
      <!-- Left Auxiliary Lens -->
      <circle cx="202" cy="226" r="6" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5" />
      <circle cx="202" cy="226" r="3" fill="#5eead4" />

      <!-- Right Auxiliary Targeter Lens -->
      <circle cx="248" cy="226" r="6" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5" />
      <circle cx="248" cy="226" r="3" fill="#5eead4" />
      
      <!-- Horizontal Scanner Laser Flare -->
      <line x1="175" y1="227" x2="275" y2="227" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    </g>

    <!-- FLOATING HOLOGRAPHIC MAGNIFYING / TARGETING RETICLE (Signature Ability: Examine) -->
    <g filter="url(#glowTeal)" transform="translate(225, 230)">
      <!-- Outer Rotating Target Ring -->
      <circle cx="0" cy="0" r="65" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="14,10" opacity="0.75" />
      <!-- Target Corner Brackets -->
      <path d="M -45 -45 L -35 -45 M -45 -45 L -45 -35" stroke="#5eead4" stroke-width="2" />
      <path d="M 45 -45 L 35 -45 M 45 -45 L 45 -35" stroke="#5eead4" stroke-width="2" />
      <path d="M -45 45 L -35 45 M -45 45 L -45 35" stroke="#5eead4" stroke-width="2" />
      <path d="M 45 45 L 35 45 M 45 45 L 45 35" stroke="#5eead4" stroke-width="2" />
      
      <!-- Hologram Card Target Analysis Overlay (Floating Below Reticle) -->
      <g transform="translate(-35, 175)">
        <rect x="0" y="0" width="70" height="95" rx="6" fill="#021f1c" fill-opacity="0.8" stroke="#5eead4" stroke-width="2" />
        <!-- Floating Examined Card Graphic Inside Scanner -->
        <rect x="10" y="12" width="50" height="70" rx="3" fill="#064e3b" fill-opacity="0.5" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4,2" />
        <!-- Scan Beam Slicing Through Card -->
        <line x1="5" y1="45" x2="65" y2="45" stroke="#ffffff" stroke-width="2" opacity="0.9" />
        <text x="35" y="60" font-family="'Courier New', monospace" font-size="7" font-weight="900" fill="#5eead4" text-anchor="middle" letter-spacing="1">EXAMINED</text>
      </g>
    </g>

  </g>

  <!-- Card Top Header Label -->
  <g transform="translate(225, 42)">
    <rect x="-125" y="-18" width="250" height="34" rx="6" fill="#021413" stroke="#14b8a6" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#5eead4" text-anchor="middle" letter-spacing="4">ROLE // INQUISITOR</text>
  </g>

  <!-- Card Bottom Label Banner -->
  <g transform="translate(225, 555)">
    <rect x="-140" y="-18" width="280" height="34" rx="6" fill="#021413" stroke="#14b8a6" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">FORENSIC SURVEILLANCE</text>
  </g>
</svg>